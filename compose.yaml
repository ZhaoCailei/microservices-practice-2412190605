services:
  # =========== 数据库 ===========
  user-db:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: user_db
    volumes:
      - user-db-data:/var/lib/mysql
    networks:
      - micro-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 5s
      timeout: 5s
      retries: 5

  lost-db:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: lost_db
    volumes:
      - lost-db-data:/var/lib/mysql
    networks:
      - micro-net
    healthcheck: # <--- 加上下面这 5 行
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  admin-db:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: admin_db
    volumes:
      - admin-db-data:/var/lib/mysql
    networks:
      - micro-net
    healthcheck: # <--- 加上这部分
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========== 微服务 ===========
  user-service:
    build:
      context: ./services/user-service
    ports:
      - "8081:8081" # 宿主 8081 -> 容器 8081（要与 application.yml 的 server.port 一致）
    environment:
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      DB_HOST: user-db
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
    depends_on:
      nacos:
        condition: service_started
      user-db:
        condition: service_healthy
    networks:
      - micro-net

  lost-service:
    build:
      context: ./services/lost-service
    ports:
      - "8082:8082" # 宿主 8082 -> 容器 8082（要与 application.yml 的 server.port 一致）
    environment:
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      DB_HOST: lost-db
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD}

    depends_on:
      nacos:
        condition: service_started
      lost-db:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - micro-net

  admin-service:
    build:
      context: ./services/admin-service
    ports:
      - "8083:8083" # 宿主 8083 -> 容器 8083（要与 application.yml 的 server.port 一致）
    environment:
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      DB_HOST: admin-db
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
    depends_on:
      nacos:
        condition: service_started
      admin-db:
        condition: service_healthy
    networks:
      - micro-net

  # =========== Nacos 注册中心 ===========
  nacos:
    image: nacos/nacos-server:v3.2.4
    container_name: nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=${NACOS_AUTH_ENABLE:-true}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE:-security}
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:-U2VjdXJlQXV0aFRva2VuMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
    ports:
      # 只绑定本机回环地址，控制台/服务端/SDK 端口不暴露到局域网或公网
      - "127.0.0.1:18080:8080"   # 控制台 UI（Nacos 3.x 控制台独立端口，容器内 8080）
      - "127.0.0.1:8848:8848"    # 服务端 HTTP OpenAPI
      - "127.0.0.1:9848:9848"    # 客户端 gRPC（= 8848 + 1000）
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    networks:
      - micro-net
networks:
  micro-net:
    driver: bridge
volumes:
  user-db-data:
  lost-db-data:
  admin-db-data:
  nacos-data:
  nacos-logs: