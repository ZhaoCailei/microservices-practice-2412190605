services:
  # =========== 数据库（每个服务一个库 + 独立业务账号） ===========
  user-db:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: user_db
      # 独立业务账号：只对 user_db 有权限，服务不再用 root 连接
      MYSQL_USER: ${USER_DB_USER:-user_app}
      MYSQL_PASSWORD: ${USER_DB_PASSWORD:-user_app_pwd}
    volumes:
      - user-db-data:/var/lib/mysql
    networks:
      - micro-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 5s
      timeout: 5s
      retries: 5

  lost-db:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: lost_db
      MYSQL_USER: ${LOST_DB_USER:-lost_app}
      MYSQL_PASSWORD: ${LOST_DB_PASSWORD:-lost_app_pwd}
    volumes:
      - lost-db-data:/var/lib/mysql
    networks:
      - micro-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  admin-db:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: admin_db
      MYSQL_USER: ${ADMIN_DB_USER:-admin_app}
      MYSQL_PASSWORD: ${ADMIN_DB_PASSWORD:-admin_app_pwd}
    volumes:
      - admin-db-data:/var/lib/mysql
    networks:
      - micro-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========== 微服务 ===========
  # 用户服务公共配置：两个实例共用，注册到同一个服务名 user-service
  user-service:
    build:
      context: ./services/user-service
    ports:
      - "8081:8081" # 实例 A：宿主 8081 -> 容器 8081
    environment:
      # 业务账号 + 密码：与 user-db 中创建的账号一致
      DB_USER: ${USER_DB_USER:-user_app}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:-user_app_pwd}
      DB_HOST: user-db
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_GROUP: ${NACOS_GROUP:-ZCL_GROUP}
      # 实例标识：日志里用它可以看清负载均衡分到了哪个实例
      INSTANCE_ID: user-service-1
    depends_on:
      nacos:
        condition: service_started
      user-db:
        condition: service_healthy
    networks:
      - micro-net

  # 用户服务实例 B：与实例 A 同一镜像、同一个服务名，但换一个宿主机端口，避免端口冲突
  user-service-b:
    build:
      context: ./services/user-service
    ports:
      - "18081:8081" # 实例 B：宿主 18081 -> 容器 8081
    environment:
      DB_USER: ${USER_DB_USER:-user_app}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:-user_app_pwd}
      DB_HOST: user-db
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_GROUP: ${NACOS_GROUP:-ZCL_GROUP}
      INSTANCE_ID: user-service-b-1
    depends_on:
      nacos:
        condition: service_started
      user-db:
        condition: service_healthy
    networks:
      - micro-net

  lost-service:
    build:
      context: ./services/lost-service
    ports:
      - "8082:8082" # 宿主 8082 -> 容器 8082（要与 application.yml 的 server.port 一致）
    environment:
      DB_USER: ${LOST_DB_USER:-lost_app}
      SPRING_DATASOURCE_PASSWORD: ${LOST_DB_PASSWORD:-lost_app_pwd}
      DB_HOST: lost-db
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_GROUP: ${NACOS_GROUP:-ZCL_GROUP}

    depends_on:
      nacos:
        condition: service_started
      lost-db:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - micro-net

  admin-service:
    build:
      context: ./services/admin-service
    ports:
      - "8083:8083" # 宿主 8083 -> 容器 8083（要与 application.yml 的 server.port 一致）
    environment:
      DB_USER: ${ADMIN_DB_USER:-admin_app}
      SPRING_DATASOURCE_PASSWORD: ${ADMIN_DB_PASSWORD:-admin_app_pwd}
      DB_HOST: admin-db
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_GROUP: ${NACOS_GROUP:-ZCL_GROUP}
    depends_on:
      nacos:
        condition: service_started
      admin-db:
        condition: service_healthy
    networks:
      - micro-net

  # =========== Nacos 注册中心 ===========
  nacos:
    image: nacos/nacos-server:v3.2.4
    container_name: nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=${NACOS_AUTH_ENABLE:-true}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE:-security}
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:-U2VjdXJlQXV0aFRva2VuMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
    ports:
      # 只绑定本机回环地址，控制台/服务端/SDK 端口不暴露到局域网或公网
      - "127.0.0.1:18080:8080"   # 控制台 UI（Nacos 3.x 控制台独立端口，容器内 8080）
      - "127.0.0.1:8848:8848"    # 服务端 HTTP OpenAPI
      - "127.0.0.1:9848:9848"    # 客户端 gRPC（= 8848 + 1000）
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    networks:
      - micro-net
networks:
  micro-net:
    driver: bridge
volumes:
  user-db-data:
  lost-db-data:
  admin-db-data:
  nacos-data:
  nacos-logs:
