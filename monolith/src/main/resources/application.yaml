server:
  port: 8080

spring:
  application:
    name: monolith

  datasource:
    url: jdbc:mysql://localhost:3306/lostfound_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    # 真实密码由环境变量注入，仓库中不留明文
    password: "${SPRING_DATASOURCE_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 让 data.sql 在启动时执行（MySQL 属外置库，默认不会执行 data.sql）
  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: update # 自动建表
    # 等 Hibernate 建完表再执行 data.sql，否则会报 Table 'users' not found
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true