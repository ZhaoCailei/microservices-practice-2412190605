server:
  port: 8080

spring:
  application:
    name: lostfound-monolith

  datasource:
    url: jdbc:mysql://localhost:3306/lostfound_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    # 真实密码由环境变量注入，仓库中不留明文
    password: "${SPRING_DATASOURCE_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update # 自动建表
    show-sql: true
    properties:
      hibernate:
        format_sql: true