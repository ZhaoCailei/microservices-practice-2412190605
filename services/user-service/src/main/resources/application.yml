server:
  port: 8081

spring:
  application:
    name: user-service
  # 配置中心：Data ID = user-service.yaml，Group = ZCL_GROUP，namespace 由 NACOS_CONFIG_NAMESPACE 选择（dev/test）
  config:
    import: "optional:nacos:user-service.yaml?group=${NACOS_GROUP:ZCL_GROUP}&refreshEnabled=true"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:nacos}
        password: "${NACOS_PASSWORD:}"
        group: ${NACOS_GROUP:ZCL_GROUP}
        register-enabled: true
      config:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:nacos}
        password: "${NACOS_PASSWORD:}"
        # 开发/测试通过 namespace 隔离：compose 里默认 zcl-dev，可切成 zcl-test
        namespace: ${NACOS_CONFIG_NAMESPACE:}
  datasource:
    # 本机跑用 localhost；docker compose 里通过 DB_HOST=user-db 覆盖
    url: jdbc:mysql://${DB_HOST:localhost}:3306/user_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    # 独立业务账号：compose 中由 DB_USER 注入（只对本库有权限），本地开发可退回 root
    username: ${DB_USER:root}
    # 密码由 SPRING_DATASOURCE_PASSWORD 注入（compose 中取自本地 .env），仓库里不留真实密码
    password: "${SPRING_DATASOURCE_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always

# 认证服务：JWT 签名密钥只从环境变量注入，仓库里不保存真实密钥
app:
  jwt:
    # Base64 编码的随机密钥，解码后至少 32 字节；本地由 .env 的 JWT_SECRET 提供
    secret: ${JWT_SECRET:}
    # 有效期（秒）已迁到 Nacos 配置中心（user-service.yaml），代码里保留 3600 兜底默认值
  gateway:
    # 网关与下游服务共享的签名密钥：/api/users/current 用它校验请求确实来自网关
    shared-secret: ${GATEWAY_SHARED_SECRET:}

# Actuator 健康端点：/actuator/health，暴露组件明细（db、diskSpace 等）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
