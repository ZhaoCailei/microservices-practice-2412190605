server:
  port: 8081

spring:
  application:
    name: user-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:nacos}
        password: "${NACOS_PASSWORD:}"
        group: ${NACOS_GROUP:ZCL_GROUP}
        register-enabled: true
  datasource:
    # 本机跑用 localhost；docker compose 里通过 DB_HOST=user-db 覆盖
    url: jdbc:mysql://${DB_HOST:localhost}:3306/user_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    # 密码由 SPRING_DATASOURCE_PASSWORD 注入（compose 中取自本地 .env），仓库里不留真实密码
    password: "${SPRING_DATASOURCE_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always
