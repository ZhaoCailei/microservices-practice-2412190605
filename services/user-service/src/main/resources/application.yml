server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    # 本机跑用 localhost；docker compose 里通过 DB_HOST=user-db 覆盖
    url: jdbc:mysql://${DB_HOST:localhost}:3306/user_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    # % 是特殊字符，统一加引号；容器里由 SPRING_DATASOURCE_PASSWORD 覆盖
    password: "${SPRING_DATASOURCE_PASSWORD:Lei040925%}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always
