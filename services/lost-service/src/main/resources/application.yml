server:
  port: 8082

spring:
  application:
    name: lost-service
  # 配置中心：Data ID = lost-service.yaml（Feign 超时、日志级别等非敏感项集中管理）
  config:
    import: "optional:nacos:lost-service.yaml?group=${NACOS_GROUP:ZCL_GROUP}&refreshEnabled=true"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:nacos}
        password: "${NACOS_PASSWORD:}"
        group: ${NACOS_GROUP:ZCL_GROUP}
        register-enabled: true
      config:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:nacos}
        password: "${NACOS_PASSWORD:}"
        namespace: ${NACOS_CONFIG_NAMESPACE:}
    # OpenFeign 超时配置已迁到 Nacos（lost-service.yaml），此处不再写死
  datasource:
    # 本机跑用 localhost；docker compose 里通过 DB_HOST=lost-db 覆盖
    url: jdbc:mysql://${DB_HOST:localhost}:3306/lost_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    # 独立业务账号：compose 中由 DB_USER 注入（只对本库有权限），本地开发可退回 root
    username: ${DB_USER:root}
    # 密码由 SPRING_DATASOURCE_PASSWORD 注入（compose 中取自本地 .env），仓库里不留真实密码
    password: "${SPRING_DATASOURCE_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true

# Actuator 健康端点：/actuator/health，暴露组件明细（db、diskSpace 等）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
