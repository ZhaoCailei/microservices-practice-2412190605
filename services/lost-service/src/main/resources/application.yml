server:
  port: 8082

spring:
  application:
    name: lost-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:nacos}
        password: "${NACOS_PASSWORD:}"
        group: DEFAULT_GROUP
        register-enabled: true
  datasource:
    # 本机跑用 localhost；docker compose 里通过 DB_HOST=lost-db 覆盖
    url: jdbc:mysql://${DB_HOST:localhost}:3306/lost_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    # 密码由 SPRING_DATASOURCE_PASSWORD 注入（compose 中取自本地 .env），仓库里不留真实密码
    password: "${SPRING_DATASOURCE_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true

# 被依赖的 user-service 地址（UserClient 用 @Value("${user.service.url}") 读取）
# 本机跑用 localhost:8081；docker compose 里通过 USER_SERVICE_URL 覆盖成 http://user-service:8081/api/users
user:
  service:
    url: "${USER_SERVICE_URL:http://localhost:8081/api/users}"
